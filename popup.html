<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Web Timer</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Web Timer</h1>
      <section class="timer" aria-live="polite">
        <h2>このタブの経過時間</h2>
        <output id="elapsed">--:--:--</output>
        <p id="timer-status">計測対象のサイトを開いてください。</p>
      </section>
      <p>利用時間を計測するドメインを入力してください。初回は主要SNSが設定されています。1行に1つ、サブドメインも対象になります。</p>
      <label for="domains">ドメイン</label>
      <textarea id="domains" rows="6" placeholder="example.com&#10;news.example.jp"></textarea>
      <p class="note">初回は「保存」を押して、Chromeのアクセス許可を承認してください。対象サイトを開いてから15分ごとに通知します。</p>
      <button id="save" type="button">保存</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
